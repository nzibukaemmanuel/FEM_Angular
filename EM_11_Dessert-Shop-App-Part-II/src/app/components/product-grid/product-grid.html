<section class="menu" id="menu" tabindex="-1">
  <div class="heading">
    <h2>Our Menu</h2>
    <p>Everything is baked in small batches, so flavours may vary with the seasons.</p>
  </div>

  <div class="search">
    <label for="search-input" class="visually-hidden">Search desserts by name</label>
    <input
      id="search-input"
      type="search"
      class="search-input"
      placeholder="Search desserts..."
      [value]="searchQuery()"
      (input)="onSearchChange($any($event.target).value)"
    />
  </div>

  <div class="toolbar">
    <div class="filters" role="tablist" aria-label="Filter desserts by category">
      @for (category of categories; track category) {
        <button
          type="button"
          role="tab"
          [attr.aria-selected]="activeCategory() === category"
          class="filter"
          [class.active]="activeCategory() === category"
          (click)="selectCategory(category)"
        >
          {{ category }}
        </button>
      }
    </div>

    <div class="sort">
      <label for="sort-select">Sort by price</label>
      <select
        id="sort-select"
        class="sort-select"
        [value]="sortDirection() ?? ''"
        (change)="onSortChange($any($event.target).value)"
      >
        <option value="">Default</option>
        <option value="asc">Low to High</option>
        <option value="desc">High to Low</option>
      </select>
    </div>
  </div>

  <div class="grid">
    @for (dessert of desserts(); track dessert.id) {
      <app-product-card
        [dessert]="dessert"
        [quantity]="quantityOf(dessert.id)"
        (add)="add.emit($event)"
        (increment)="increment.emit($event)"
        (decrement)="decrement.emit($event)"
      />
    } @empty {
      <p class="empty">No desserts match your search — try a different name or category.</p>
    }
  </div>
</section>
