<div class="page-header">
  <h1>Board: {{ boardId() }}</h1>
  <p>Details for board "{{ boardId() }}" will appear here.</p>
  <a class="btn" [routerLink]="['new-task']">+ Add task</a>
</div>

<div class="controls">
  <label>
    Status:
    <app-select-field
      [options]="statusOptions"
      [value]="effectiveStatus()"
      ariaLabel="Filter by status"
      (valueChange)="updateQueryParams({ status: $event })"
    />
  </label>

  <label>
    Sort by:
    <app-select-field
      [options]="sortOptions"
      [value]="effectiveSort()"
      ariaLabel="Sort by"
      (valueChange)="updateQueryParams({ sort: $event })"
    />
  </label>
</div>

<ul class="task-list">
  @for (task of tasks(); track task.id) {
    <li class="task-card">
      <a class="task-card__title" [routerLink]="['tasks', task.id]">{{ task.title }}</a>
      <span class="status-badge" [attr.data-status]="task.status">{{ task.status }}</span>
    </li>
  } @empty {
    <li class="empty-state">No tasks match the current filter.</li>
  }
</ul>

<router-outlet />

<div class="page-nav">
  <button type="button" class="btn-tertiary" (click)="goBack()">&larr; Back to boards</button>
</div>
