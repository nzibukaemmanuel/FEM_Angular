<form [formGroup]="form" (ngSubmit)="submit()" class="task-form">
  <label>
    Title
    <input type="text" formControlName="title" />
  </label>

  @if (form.controls.title.invalid && form.controls.title.touched) {
    <p class="field-error" role="alert">
      @if (form.controls.title.hasError('required')) {
        Title is required.
      } @else if (form.controls.title.hasError('minlength')) {
        Title must be at least 3 characters.
      }
    </p>
  }

  <label>
    Status
    <app-select-field
      [options]="statusOptions"
      [value]="status()"
      ariaLabel="Task status"
      (valueChange)="setStatus($event)"
    />
  </label>

  @if (isDirty()) {
    <p class="unsaved-hint" role="status">You have unsaved changes.</p>
  }

  <div class="task-form__actions">
    <button type="button" class="btn-secondary" (click)="cancel.emit()">Cancel</button>
    <button type="submit">{{ submitLabel() }}</button>
  </div>
</form>
