@if (task(); as t) {
  <div class="task-detail-card">
    <div class="task-detail-card__header">
      <h2>{{ t.title }}</h2>
      <span class="status-badge" [attr.data-status]="t.status">{{ t.status }}</span>
    </div>
    @if (t.description) {
      <p class="task-detail-card__description">{{ t.description }}</p>
    }
    @if (t.dueDate) {
      <p class="task-detail-card__due-date">Due {{ t.dueDate }}</p>
    }
  </div>
  <a class="btn" [routerLink]="['edit']">Edit task</a>
} @else {
  <p class="empty-state">Task not found.</p>
}

<button type="button" class="btn-secondary" (click)="goToBoard()">&larr; Back to board</button>
