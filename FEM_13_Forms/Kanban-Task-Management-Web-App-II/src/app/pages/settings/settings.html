<div class="page-header">
  <h1>Settings</h1>
  <p>Application settings will appear here.</p>
</div>

<form class="settings-form" (submit)="$event.preventDefault()">
  <label>
    Display name:
    <input
      type="text"
      [value]="displayName()"
      (input)="onDisplayNameInput($any($event.target).value)"
    />
  </label>

  @if (hasUnsavedChanges()) {
    <p class="unsaved-hint" role="status">You have unsaved changes.</p>
  }

  <button type="button" (click)="save()">Save &amp; return to boards</button>
</form>
