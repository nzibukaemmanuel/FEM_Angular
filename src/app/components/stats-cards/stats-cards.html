<div class="metrics-grid" aria-label="Text statistics">
  <div class="card card-purple" [class.over-limit]="overLimit()">
    <div class="card-content" aria-live="polite" aria-atomic="true">
      <div class="card-number">{{ totalCharacters() }}</div>
      <div class="card-label">Total Characters</div>
    </div>
    <div class="pattern1">
      <div class="circle-grid">
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
      </div>
    </div>
  </div>

  <div class="card card-orange">
    <div class="card-content" aria-live="polite" aria-atomic="true">
      <div class="card-number">{{ wordCount() }}</div>
      <div class="card-label">Word Count</div>
    </div>
    <div class="pattern2">
      <span></span><span></span><span></span>
      <span></span><span></span><span></span>
      <span></span><span></span><span></span>
    </div>
  </div>

  <div class="card card-coral">
    <div class="card-content" aria-live="polite" aria-atomic="true">
      <div class="card-number">{{ paddedLineCount() }}</div>
      <div class="card-label">Line Count</div>
    </div>
    <div class="pattern3">
      <span class="cell"></span><span class="cell"></span><span class="cell"></span>
      <span class="cell"></span><span class="cell"></span><span class="cell"></span>
      <span class="cell"></span><span class="cell"></span><span class="cell"></span>
    </div>
  </div>
</div>
