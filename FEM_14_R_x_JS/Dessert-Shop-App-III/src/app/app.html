<nav class="skip-links" aria-label="Skip links">
  <a class="skip-link" href="#menu">Skip to Menu</a>
  <a class="skip-link" href="#about">Skip to About</a>
  <a class="skip-link" href="#contact">Skip to Contact</a>
</nav>

<app-header [totalQuantity]="(totalQuantity$ | async) ?? 0" />
<main>
  <app-hero />
  <app-product-grid
    [cartItems]="(items$ | async) ?? []"
    (add)="addToCart($event)"
    (increment)="incrementItem($event)"
    (decrement)="decrementItem($event)"
  />
  <app-cart-summary
    [items]="(items$ | async) ?? []"
    [subtotal]="(subtotal$ | async) ?? 0"
    (remove)="removeItem($event)"
    (confirmOrder)="confirmOrder()"
  />
</main>
<app-footer />
<app-order-modal
  [orderConfirmed]="(orderConfirmed$ | async) ?? false"
  [items]="(items$ | async) ?? []"
  [subtotal]="(subtotal$ | async) ?? 0"
  (startNewOrder)="startNewOrder()"
/>
<app-toast [message]="(toastMessage$ | async) ?? null" />

<router-outlet />
