<div class="page-header">
  <h1>Board: {{ boardId() }}</h1>
  <p>Details for board "{{ boardId() }}" will appear here.</p>
</div>

<div class="controls">
  <label>
    Status:
    <select #statusSelect [value]="effectiveStatus()" (change)="updateQueryParams({ status: statusSelect.value })">
      <option value="all">All</option>
      <option value="todo">To do</option>
      <option value="doing">In progress</option>
      <option value="done">Done</option>
    </select>
  </label>

  <label>
    Sort by:
    <select #sortSelect [value]="effectiveSort()" (change)="updateQueryParams({ sort: sortSelect.value })">
      <option value="title">Title</option>
      <option value="status">Status</option>
    </select>
  </label>
</div>

<ul class="task-list">
  @for (task of tasks(); track task.id) {
    <li class="task-card">
      <a class="task-card__title" [routerLink]="['tasks', task.id]">{{ task.title }}</a>
      <span class="status-badge" [attr.data-status]="task.status">{{ task.status }}</span>
    </li>
  } @empty {
    <li class="empty-state">No tasks match the current filter.</li>
  }
</ul>

<router-outlet />

<button type="button" class="btn-secondary" (click)="goBack()">&larr; Back to boards</button>
